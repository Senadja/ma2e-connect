    <meta name="twitter:image" content="https://ma2e-connect.vercel.app/logo-ma2e.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "alternateName": "MA2E",

        "areaServed": "CI",
        "address": {
          "@type": "PostalAddress",

          "addressLocality": "Abidjan",
          "addressCountry": "CI"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+225 27 21 23 64 87",
          "email": "contact@ma2e.ci",
          "contactType": "customer service"
        }
      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MA2E",
        "url": "https://ma2e-connect.vercel.app"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Traduction Google Website Translate (gratuite, sans clé API).
         Pilotée par le sélecteur de langue (cookie googtrans + reload) ; UI native masquée en CSS. -->
    <div id="google_translate_element" aria-hidden="true"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: 'fr', includedLanguages: 'fr,en', autoDisplay: false },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.tsx"></script>
