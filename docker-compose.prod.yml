# Stack de PRODUCTION (serveur OVH) : PostgreSQL + API Node + Caddy (reverse proxy + HTTPS auto).
# Le FRONT n'est PAS ici (il est sur Vercel). Caddy expose l'API en HTTPS.
#
# Déploiement :
#   cp .env.prod.example .env.prod   (puis remplir)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Front Vercel : voir vercel.json (rewrites /api et /documents/uploads vers ce serveur).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ma2e_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ma2edb
    volumes:
      - ma2e_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ma2e_admin -d ma2edb"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # connection_limit explicite : pool prévisible sous charge (par défaut Prisma = cpus*2+1,
      # soit très peu dans un conteneur bridé). 15 reste largement sous le max_connections Postgres.
      DATABASE_URL: postgresql://ma2e_admin:${DB_PASSWORD}@db:5432/ma2edb?schema=public&connection_limit=15
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis — chaîne aléatoire >= 32 caractères (openssl rand -hex 32)}
      JWT_EXPIRES_IN: "8h"
      # Coupe-circuit de la double authentification (voir .env.prod.example).
      MFA_ENABLED: ${MFA_ENABLED:-true}
      # Origines autorisées (front Vercel). Les rewrites Vercel passent par le serveur,
      # mais on autorise quand même l'origine pour tout appel direct.
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_DIR: /app/uploads
      # Pièces d'identité (CNI/passeport) : dossier PRIVÉ, servi uniquement via URL signée.
      # DOIT être sur un volume persistant distinct de /app/uploads (qui est servi publiquement).
      APP_DOCS_DIR: /app/app-docs
      SEED_ON_START: ${SEED_ON_START:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-MA2E <no-reply@ma2e.ci>}
      MAIL_TO_APPLICATIONS: ${MAIL_TO_APPLICATIONS:-contact@ma2e.ci}
    volumes:
      - ma2e_uploads:/app/uploads
      - ma2e_appdocs:/app/app-docs
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    # La passerelle (openresty) en amont termine le TLS et nous proxifie en HTTP.
    # Caddy n'écoute donc qu'en HTTP (:80), publié sur le port hôte 3182 que la passerelle vise.
    ports:
      - "3182:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  ma2e_pgdata:
  ma2e_uploads:
  ma2e_appdocs:
  caddy_data:
  caddy_config:
